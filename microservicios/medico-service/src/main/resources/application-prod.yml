server:
  port: ${SERVER_PORT:9081}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bd_medico?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect

empresa:
  ambiente: PRODUCCION
