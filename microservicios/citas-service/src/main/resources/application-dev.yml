server:
  port: ${SERVER_PORT:8082}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bd_citas_dev?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: true

empresa:
  ambiente: DESARROLLO

servicios:
  paciente:
    url: ${PACIENTE_URL:http://localhost:8080}
  medico:
    url: ${MEDICO_URL:http://localhost:8081}
  validar-referencias: ${VALIDAR_REFERENCIAS:true}
